[versions]
##########################################################################
# Plugins
# Check this on https://kotlinlang.org/docs/releases.html
kotlin = "2.4.10"
# Check this on https://plugins.gradle.org/plugin/org.jetbrains.intellij.platform/
intelliJPlatform = "2.18.1"
# Check this on https://plugins.gradle.org/plugin/dev.yumi.gradle.licenser/
yumiGradleLicenser = "4.0.0"
##########################################################################
# Java Configuration
# The Java version the JDK will be for compiling and running code.
# Check this on https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html#platformVersions
java = "25"
# The Java version the JDK will be for running Gradle.
gradleJava = "25"
##########################################################################
# IntelliJ Metadata
platform = "2026.2"
gradle = "9.7.1"
##########################################################################
[plugins]
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
yumiGradleLicenser = { id = "dev.yumi.gradle.licenser", version.ref = "yumiGradleLicenser" }
